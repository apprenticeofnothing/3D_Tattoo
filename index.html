<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#262a33" />
  <title>Tattoo preview</title>
</head>
<body>
  <div id="app">
    <div class="bar top">
      <span class="title">Tattoo preview</span>
      <button id="btn-add" class="btn primary">Add design</button>
      <button id="btn-parts" class="btn">Body part</button>
      <button id="btn-undo" class="btn" title="Undo (Ctrl+Z)" disabled>Undo</button>
      <button id="btn-redo" class="btn" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
      <button id="btn-compare" class="btn toggle">Compare</button>
      <button id="btn-photo" class="btn">Photo</button>
      <button id="btn-more" class="btn">More</button>
      <input id="file" type="file" multiple accept=".glb,.gltf,.bin,.obj,.mtl,.ply,.jpg,.jpeg,.png,.webp" class="hidden" />
      <input id="design-file" type="file" accept=".svg,.png,.jpg,.jpeg,.webp,image/svg+xml,image/png,image/jpeg" class="hidden" />
      <input id="project-file" type="file" accept=".json,application/json" class="hidden" />
    </div>
    <div id="stage">
      <div id="hint" class="hint hidden"></div>
      <div id="compare-labels" class="compare-labels hidden"><span>A</span><span>B</span></div>
    </div>
    <div id="status" class="bar bottom">Starting…</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
